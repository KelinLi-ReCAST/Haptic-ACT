[project]
name = "lerobot-policy-acthaptic"
version = "0.1.0"
description = "F/T Haptic-ACT: LeRobot's ACT with a force/torque token, haptic dropout and a learned re-planning head"
requires-python = ">=3.12"
dependencies = ["lerobot==0.6.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_policy_acthaptic"]
